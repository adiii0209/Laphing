<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Rich 3D gradient for dumpling skin -->
    <linearGradient id="momoSkin" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FFF5DC"/>
      <stop offset="100%" stop-color="#EAD19D"/>
    </linearGradient>

    <!-- Warm crease / pleat shadow -->
    <linearGradient id="pleatShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9C6B28" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#D4A75A" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Rising steam -->
    <linearGradient id="steamWarm" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF3B30" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF9500" stop-opacity="0"/>
    </linearGradient>

    <filter id="momoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Steam wisps rising from the top knot -->
  <path d="M25 15 C23 11 27 9 25 4" fill="none" stroke="url(#steamWarm)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M32 14 C30 9 35 7 32 2" fill="none" stroke="url(#steamWarm)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M39 15 C37 11 41 9 39 4" fill="none" stroke="url(#steamWarm)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Standalone Momo Shape (NO CIRCLE) -->
  <g filter="url(#momoGlow)">
    <!-- Main Plump Dumpling Body -->
    <path d="M6 44 C6 56 18 61 32 61 C46 61 58 56 58 44 C58 32 46 22 32 22 C18 22 6 32 6 44 Z" 
          fill="url(#momoSkin)" 
          stroke="#5C3B14" 
          stroke-width="2.4" 
          stroke-linejoin="round"/>

    <!-- Hand-Pinched Top Crown / Knot -->
    <path d="M26 22 C29 17 35 17 38 22 C35 24 29 24 26 22 Z" 
          fill="#FFE2A4" 
          stroke="#5C3B14" 
          stroke-width="2" 
          stroke-linejoin="round"/>

    <!-- Pleats / Fold Creases spreading outwards from the top knot -->
    <!-- Center fold -->
    <path d="M32 22 Q32 40 32 59" fill="none" stroke="url(#pleatShadow)" stroke-width="2.2" stroke-linecap="round"/>
    
    <!-- Left folds -->
    <path d="M29 22 Q20 34 16 52" fill="none" stroke="url(#pleatShadow)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M27 23 Q12 37 10 46" fill="none" stroke="url(#pleatShadow)" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Right folds -->
    <path d="M35 22 Q44 34 48 52" fill="none" stroke="url(#pleatShadow)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M37 23 Q52 37 54 46" fill="none" stroke="url(#pleatShadow)" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Red chili touch at top pinch -->
    <circle cx="32" cy="21.5" r="2.5" fill="#FF3B30"/>
  </g>
</svg>
